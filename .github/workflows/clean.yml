name: Cleanup

permissions:
  actions: write

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup:
    name: Cleanup old artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set thresholds
        run: |
          echo "THRESHOLD_LIST=$(TZ='UTC' date -d '1 days ago' +%Y-%m-%dT%H:%M:%S%:z)" >> $GITHUB_ENV
          echo "THRESHOLD_DELETE=$(TZ='UTC' date -d '1 days ago' +%Y-%m-%dT%H:%M:%S%:z)" >> $GITHUB_ENV

      - name: Process artifacts
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq \
            ".artifacts[] | select(.created_at < \"$THRESHOLD_LIST\") | {
              branch: .workflow_run.head_branch,
              created_at: .created_at,
              expired: .expired,
              expires_at: .expires_at,
              id: .id,
              name: .name,
              size_kb: (.size_in_bytes / 1024 | floor),
              workflow_run_id: .workflow_run.id
            }" > artifacts.json

          if [ -s artifacts.json ]; then
            echo "##### Artifacts older than 1 days (created before $THRESHOLD_LIST):" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq -s '.' artifacts.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "##### Deleting artifacts older than 1 days (created before $THRESHOLD_DELETE):" >> $GITHUB_STEP_SUMMARY
            jq -c "select(.created_at < \"$THRESHOLD_DELETE\")" artifacts.json | while read -r item; do
              id=$(echo "$item" | jq -r '.id')
              echo "Deleting artifact ID: $id" >> $GITHUB_STEP_SUMMARY
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
            done
          else
            echo "##### No artifacts older than 1 days found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Process caches
        run: |
          gh api repos/${{ github.repository }}/actions/caches --paginate --jq \
            ".actions_caches[] | select(.created_at < \"$THRESHOLD_LIST\") | {
              id: .id,
              key: .key,
              ref: .ref,
              created_at: .created_at,
              last_accessed_at: .last_accessed_at,
              size_kb: (.size_in_bytes / 1024 | floor)
            }" > caches.json

          if [ -s caches.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "##### Caches older than 1 days (created before $THRESHOLD_LIST):" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq -s '.' caches.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "##### Deleting caches older than 1 days (created before $THRESHOLD_DELETE):" >> $GITHUB_STEP_SUMMARY
            jq -c "select(.created_at < \"$THRESHOLD_DELETE\")" caches.json | while read -r item; do
              id=$(echo "$item" | jq -r '.id')
              echo "Deleting cache ID: $id" >> $GITHUB_STEP_SUMMARY
              gh api -X DELETE repos/${{ github.repository }}/actions/caches/$id
            done
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "##### No caches older than 1 days found." >> $GITHUB_STEP_SUMMARY
          fi
