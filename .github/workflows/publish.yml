name: Publish

on:
  push:
    tags:
      - '@guineadog/*@*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Identify package
        id: pkg
        run: |
          # The tag format is @scope/pkg-name@version, e.g., @guineadog/normalize-typography@0.4.0
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag: $TAG"

          # Extract everything before the last '@'
          PKG_NAME="${TAG%@*}"
          echo "Package Name: $PKG_NAME"

          # Find the workspace directory for this package
          # PKG_PATH will be something like "packages/<package-name>"
          PKG_PATH=$(npm query ".workspace" | jq -r --arg PKG_NAME "$PKG_NAME" '.[] | select(.name == $PKG_NAME) | .location')

          if [ -z "$PKG_PATH" ] || [ "$PKG_PATH" == "null" ]; then
            echo "Error: Could not find workspace for package $PKG_NAME"
            exit 1
          fi

          echo "path: $PKG_PATH"
          echo "path=$PKG_PATH" >> $GITHUB_OUTPUT
      - run: npm run clean
      - name: Publish to NPM
        run: npm publish -w ${{ steps.pkg.outputs.path }} --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
