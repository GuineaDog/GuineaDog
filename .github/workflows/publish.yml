name: Publish

on:
  push:
    tags:
      - '@guineadog/*@*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Tag is on Main Branch
        id: check_branch
        run: |
          echo "publish=false" >> $GITHUB_OUTPUT

          GH_REF="Current github.ref: ${{ github.ref }}"
          echo "$GH_REF"
          echo "$GH_REF" >> $GITHUB_STEP_SUMMARY

          CURR_BRANCH="Current branch/ref: ${{ env.BRANCH_NAME }}"
          echo "$CURR_BRANCH"
          echo "$CURR_BRANCH" >> $GITHUB_STEP_SUMMARY

          # The tag format is @scope/pkg-name@version, e.g., @guineadog/normalize-typography@0.4.0
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Triggered by tag: $TAG_NAME"
          echo "TAG=$TAG_NAME" >> $GITHUB_OUTPUT

          # Fetch the latest main branch to compare
          git fetch origin main:main

          # Check if the current commit (HEAD) is an ancestor of the main branch
          if git merge-base --is-ancestor HEAD main; then
            echo "✅ Success: Tag $TAG_NAME is on main branch."
            echo "### ✅ Publication triggered for tag: $TAG_NAME :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            ERROR_MSG="❌❌❌ :x: Error: Tag $TAG_NAME was not created from the 'main' branch. Releasing from other branches is prohibited. ❌❌❌"
            echo "$ERROR_MSG"
            echo "$ERROR_MSG" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Project Dependencies
        run: npm ci

      - name: Identify Package and Workspace Path
        if: steps.check_branch.outputs.publish == 'true'
        id: pkg
        run: |
          TAG="${{ steps.check_branch.outputs.TAG }}"
          echo "Triggered by tag: $TAG"

          # Extract everything before the last '@'
          PKG_NAME="${TAG%@*}"
          echo "Package Name: $PKG_NAME"

          # Find the workspace directory for this package
          # PKG_PATH will be something like "packages/<package-name>"
          PKG_PATH=$(npm query ".workspace" | jq -r --arg PKG_NAME "$PKG_NAME" '.[] | select(.name == $PKG_NAME) | .location')

          if [ -z "$PKG_PATH" ] || [ "$PKG_PATH" == "null" ]; then
            echo "Error: Could not find workspace for package $PKG_NAME"
            exit 1
          fi

          echo "path: $PKG_PATH"
          echo "path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Clean Build Artifacts
        if: steps.check_branch.outputs.publish == 'true'
        run: npm run clean

      - name: Publish to NPM Registry
        if: steps.check_branch.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/')
        run: npm publish -w ${{ steps.pkg.outputs.path }} --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
