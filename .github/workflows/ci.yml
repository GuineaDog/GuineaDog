name: CI

permissions:
  contents: read # To read the code
  actions: write # To cancel runs (gh run cancel) and delete the cache
  pull-requests: read # To check for PR (gh pr list)

on:
  #push:
  #  branches:
  #    - main
  pull_request:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 4 * * *' # At 04:00 UTC # https://crontab.guru/#0_4_*_*_*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get runner info
        id: runner_info
        run: |
          echo "##### Runner info" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "- Runner name: \`$RUNNER_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner OS: \`$RUNNER_OS\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner arch: \`$RUNNER_ARCH\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner workspace: \`$RUNNER_WORKSPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner temp: \`$RUNNER_TEMP\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner tool cache: \`$RUNNER_TOOL_CACHE\`" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Check branch info
        id: branch_info
        run: |
          #VERSION=$(node -p "require('./package.json').version")
          echo "##### Branch info" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          #echo "- Version: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- github.head_ref (only for PR): \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- github.ref_name: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  verify:
    name: Verify
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Run prettier
        id: prettier
        run: |
          ST_PRETTIER_EXIT=0
          npx prettier --check . || ST_PRETTIER_EXIT=$?
          exit $ST_PRETTIER_EXIT
        continue-on-error: true

      - name: Run lint
        id: linter
        run: |
          ST_LINTER_EXIT=0
          npm run lint || ST_LINTER_EXIT=$?
          exit $ST_LINTER_EXIT
        continue-on-error: true

      - name: Run type-check for tests
        id: type-checker
        run: |
          ST_TYPE_CHECKER_EXIT=0
          npm run type-check || ST_TYPE_CHECKER_EXIT=$?
          exit $ST_TYPE_CHECKER_EXIT
        continue-on-error: true

      - name: Run tests
        id: tests
        run: npm run test
        continue-on-error: true

      - name: Prune dependencies
        id: prune_deps
        run: |
          echo "Prune dependencies for workspaces"
          npm prune --workspaces
          echo ""
          echo "Prune dependencies for root"
          npm prune
        continue-on-error: true

      - name: Deduplicate dependencies
        id: dedupe_deps
        run: |
          echo "Deduplicate dependencies for workspaces"
          npm dedupe --workspaces
          echo ""
          echo "Deduplicate dependencies for root"
          npm dedupe
        continue-on-error: true

      - name: Run Knip (unused code and deps)
        id: knip
        run: npm run knip
        continue-on-error: true

      - name: Run dependency-cruiser
        id: lint_deps
        run: npm run lint:deps
        continue-on-error: true

      - name: Check for outdated dependencies
        id: outdated_deps
        run: |
          echo "Outdated dependencies for workspaces"
          npm outdated --workspaces
          echo ""
          echo "Outdated dependencies for root"
          npm outdated
        continue-on-error: true

      - name: Security audit
        id: audit_deps
        run: |
          echo "Security audit for workspaces"
          npm audit --workspaces
          echo ""
          echo "Security audit for root"
          npm audit
        continue-on-error: true

      - name: Create Workflow Summary
        if: always()
        run: |
          get_status() {
            local outcome=$1
            if [ "$outcome" == "success" ]; then
              echo "OK"
            elif [ "$outcome" == "failure" ]; then
              echo "There are some issues. Check log."
            elif [ "$outcome" == "skipped" ]; then
              echo "Skipped"
            else
              echo "Unknown ($outcome)"
            fi
          }

          echo "##### Prettier, Linter, Type-checker, Tests" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Prettier | $(get_status "${{ steps.prettier.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $(get_status "${{ steps.linter.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Type-check | $(get_status "${{ steps.type-checker.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $(get_status "${{ steps.tests.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY

          echo "##### Dependencies" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Prune dependencies (only report) | $(get_status "${{ steps.prune_deps.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Deduplicate dependencies (only report) | $(get_status "${{ steps.dedupe_deps.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Knip | $(get_status "${{ steps.knip.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency-cruiser | $(get_status "${{ steps.lint_deps.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Outdated dependencies | $(get_status "${{ steps.outdated_deps.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Security audit | $(get_status "${{ steps.audit_deps.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY

      - name: Check result
        if: steps.prettier.outcome == 'failure' || steps.linter.outcome == 'failure' || steps.type-checker.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.prune_deps.outcome == 'failure' || steps.dedupe_deps.outcome == 'failure' || steps.knip.outcome == 'failure' || steps.lint_deps.outcome == 'failure' || steps.outdated_deps.outcome == 'failure' || steps.audit_deps.outcome == 'failure'
        run: exit 1
